# Copy to .github/workflows/canvas-lab.yml in YOUR repository.
# Source-only kit: this workflow has not been executed by the chat assistant.
# No Apple credentials, certificates, or personal access tokens are needed here.
name: Build GestaltX Canvas Lab (experimental)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run portable synthetic-file tests (not iOS tests)
        run: python3 -m unittest discover -s tests -v

  build:
    needs: host-tests
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out this patch kit
        uses: actions/checkout@v7
        with:
          path: kit
          persist-credentials: false

      - name: Check out fixed GestaltX 1.1.1 source
        uses: actions/checkout@v7
        with:
          repository: huamidev/GestaltX
          ref: f34d5a7271c14e540edb58e328dc9c06f8f3368f
          path: upstream
          persist-credentials: false

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Require Xcode 27 or newer
        shell: bash
        run: |
          set -euo pipefail
          major="$(xcodebuild -version | awk '/^Xcode / { split($2, parts, "."); print parts[1]; exit }')"
          if [[ ! "$major" =~ ^[0-9]+$ ]] || (( major < 27 )); then
            echo '::error::This source requires Xcode 27+. The selected runner does not provide it; no IPA has been built.'
            exit 1
          fi

      - name: Apply add-on to fixed source
        id: patch
        run: python3 kit/apply_patch.py upstream

      - name: Bundle corresponding source and this kit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          zip -qr "$RUNNER_TEMP/GestaltX_CanvasLab_source.zip" upstream kit \
            -x '*/.git/*' '*/build/*' '*/target/*' '*/.test-work/*' '*/__pycache__/*' '*.pyc'

      - name: Restore native device console cache
        id: native-cache
        uses: actions/cache@v4
        with:
          path: upstream/Native/DeviceConsole/build/GXDeviceConsole.xcframework
          key: canvaslab-native-v2-${{ runner.os }}-${{ hashFiles('upstream/Native/DeviceConsole/build-xcframework.sh', 'upstream/Native/DeviceConsole/Cargo.toml', 'upstream/Native/DeviceConsole/Cargo.lock', 'upstream/Native/DeviceConsole/src/**', 'upstream/Native/DeviceConsole/vendor/**') }}

      - name: Build upstream native device console
        if: steps.native-cache.outputs.cache-hit != 'true'
        working-directory: upstream/Native/DeviceConsole
        shell: bash
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          command -v cmake >/dev/null || brew install cmake
          command -v nasm >/dev/null || brew install nasm
          bash build-xcframework.sh

      - name: Build and ad-hoc sign IPA using upstream script
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          export BUILD_DATE="$(date -u +%F)"
          bash .github/scripts/build-ipa.sh "$RUNNER_TEMP/canvaslab-ipa"
          test -s "$RUNNER_TEMP/canvaslab-ipa/GestaltX_1.1.1.ipa"
          cp "$RUNNER_TEMP/canvaslab-ipa/GestaltX_1.1.1.ipa" "$RUNNER_TEMP/GestaltX_CanvasLab_1.1.1.ipa"

      - name: Upload experimental IPA
        uses: actions/upload-artifact@v7
        with:
          name: GestaltX-CanvasLab-IPA-UNTESTED
          path: ${{ runner.temp }}/GestaltX_CanvasLab_1.1.1.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload corresponding source even if compilation failed
        if: always() && steps.source.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: GestaltX-CanvasLab-source
          path: ${{ runner.temp }}/GestaltX_CanvasLab_source.zip
          if-no-files-found: error
          retention-days: 14
